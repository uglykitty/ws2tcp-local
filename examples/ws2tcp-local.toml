# Example configuration for ws2tcp-local.
#
# Command-line arguments override values from this file.
# Do not commit real credentials here. Prefer --basic-auth or
# WS2TCP_LOCAL_BASIC_AUTH for sensitive values.

listen = "127.0.0.1:3128"
# Optional. Also bind a local SOCKS5 (socks5h) proxy sharing the same gateway,
# routing rules, and proxy mode. Only the no-authentication SOCKS5 method is
# supported. Commonly 127.0.0.1:1080; unset to disable the SOCKS5 listener.
# socks_listen = "127.0.0.1:1080"
gateway = "wss://example.com"
# Optional. Prefer --basic-auth or WS2TCP_LOCAL_BASIC_AUTH for real credentials.
# basic_auth = "user:pass"
buffer_size = 16384
log_level = "ws2tcp_local=info"
proxy_mode = "auto"
insecure = false

# Use a path prefix, for example wss://example.com/router, only when a reverse
# proxy strips that prefix before forwarding to ws2tcp-router.
#
# By default, ws2tcp-local runs in auto mode and checks the built-in gfwlist URL
# at startup and on the configured refresh interval, downloading only when the remote
# Last-Modified timestamp differs from the cached file timestamp. Matched
# domains use this gateway; unmatched domains and the initial rule-load failure
# case connect directly.
#
# Optional. Defaults to "auto", which routes only matched domains through the
# gateway. Use "global" to route every domain through the gateway.
# proxy_mode = "auto"
#
# Optional. Rule list refresh interval in seconds. Defaults to 60.
# rule_refresh_interval_secs = 60
#
# Optional. Defaults to false, which enables normal TLS server certificate
# validation. Set to true only when connecting to a gateway with an untrusted
# certificate, such as a self-signed certificate used during development.
# insecure = false
#
# Optional. Merge one Squid dstdomain entry per line with the built-in gfwlist.
# Relative paths are resolved from this config file's directory. In auto mode,
# this file is checked on the same refresh interval and reloaded only when its
# modification time changes.
# custom_domain_rules = "custom-domains.txt"
